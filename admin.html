<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fashion Point Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="wrap"><header><a href="index.html" class="brand">FP <span>FASHION POINT <small>JAGRAON · ADMIN</small></span></a><a href="index.html">View store ↗</a></header>
<section id="loginPanel" class="panel"><p class="eyebrow">OWNER ACCESS</p><h1>Store <em>login</em></h1><p class="muted">Sign in with the authorised store-owner account.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button><p id="loginMessage" role="status"></p></form></section>
<section id="dashboard" hidden><div class="heading"><div><p class="eyebrow">CATALOGUE CONTROL</p><h1>Product <em>manager</em></h1></div><button id="signOut" class="secondary">Sign out</button></div><div class="columns"><section class="panel"><h2 id="formTitle">Add product</h2><form id="productForm"><input id="productId" type="hidden"><label>Product name<input id="name" required maxlength="120"></label><div class="two"><label>Category<select id="category"><option value="men">Men</option><option value="women">Women</option><option value="kids">Kids</option><option value="footwear">Footwear</option></select></label><label>SKU / code<input id="sku"></label></div><label>Description<textarea id="description" rows="3"></textarea></label><div class="two"><label>Price ₹<input id="price" type="number" min="0" step=".01" required></label><label>Sale price ₹<input id="salePrice" type="number" min="0" step=".01"></label></div><label>Sizes (comma separated)<input id="sizes" placeholder="S, M, L, XL"></label><label>Colours (comma separated)<input id="colors" placeholder="Black, Navy"></label><label>Stock quantity<input id="stock" type="number" min="0" value="0" required></label><label>Photo (JPG/PNG/WebP, max 5 MB)<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Or image URL<input id="imageUrl" type="url"></label><label class="check"><input id="active" type="checkbox" checked> Show on store</label><div class="two"><button class="primary" type="submit">Save product</button><button class="secondary" id="clear" type="button">Clear</button></div><p id="formMessage" role="status"></p></form></section><section class="panel"><div class="heading"><h2>Products</h2><button id="refresh" class="secondary">Refresh</button></div><input id="search" type="search" placeholder="Search products"><div id="productList" class="list"><p class="muted">Configure Supabase to load products.</p></div></section></div></section><footer>Private product management · Fashion Point Jagraon</footer></main><script type="module" src="admin.js"></script></body></html>
